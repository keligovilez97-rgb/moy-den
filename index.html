<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мой день">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Мой день</title>
<style>
:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:#38383a;--text:#f2f2f7;--muted:#8e8e93;
  --accent:#f5b81c;--accent-soft:rgba(245,184,28,.16);--accent-ink:#1a1300;
  --good:#30d158;--warn:#ff9f0a;--bad:#ff453a;--done:#636366;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f2f2f7;--card:#fff;--card2:#ececf1;--line:#dcdce1;--text:#1c1c1e;--muted:#6e6e73;
    --accent:#d39200;--accent-soft:rgba(211,146,0,.13);--accent-ink:#fff;--done:#aeaeb2;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior-y:none;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1{font-size:30px;line-height:1.1;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 4px 8px}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:14px}
.hidden{display:none!important}

/* header */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.navbtns{display:flex;gap:6px;align-items:center;padding-bottom:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--accent)}
.chip{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}

/* progress */
.prog{margin-top:14px;padding:14px 16px;display:flex;gap:16px;align-items:center}
.ring{width:58px;height:58px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.prog .t{font-weight:600}
.next{margin-top:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--accent-soft)}
.next .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px var(--accent-soft)}
.next .when{margin-left:auto;color:var(--accent);font-weight:600;white-space:nowrap}

/* list */
.list{margin-top:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:62px;position:relative;width:100%;border:0;background:none;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--line)}
.circ{width:28px;height:28px;border-radius:50%;border:2px solid var(--done);flex:none;display:grid;place-items:center;transition:.15s}
.row.done .circ{background:var(--accent);border-color:var(--accent)}
.row.done .circ::after{content:"";width:8px;height:14px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-2px) rotate(45deg)}
.row .body{flex:1;min-width:0}
.row .name{font-size:18px;display:flex;align-items:center;gap:7px}
.row.done .name{color:var(--done);text-decoration:line-through;text-decoration-color:var(--done)}
.row .meta{font-size:13px;color:var(--muted);margin-top:2px}
.row .meta .w{color:var(--warn)}
.row .time{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;white-space:nowrap}
.row .time small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.row.now .time{color:var(--accent)}
.row.late:not(.done) .time{color:var(--warn)}
.row.done .time{color:var(--done)}
.tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px}
.bell{width:14px;height:14px;color:var(--muted);flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--accent)}

/* plan */
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 0;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}
.seg button.today{color:var(--accent)}
.pitem{margin-top:10px;padding:4px 0}
.pitem.off .phead ~ *{display:none}
.pitem.off .pname{color:var(--muted)}
.phead{display:flex;align-items:center;gap:10px;padding:10px 16px}
.pname{flex:1;min-width:0;font-size:17px;font-weight:600;border:0;background:none;padding:4px 0;border-bottom:1px dashed transparent}
.phead input.pname{background:none;border-radius:0;padding:4px 0;font-size:17px}
input.pname:focus{outline:none;border-bottom-color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-size:15px;min-height:46px}
.prow label{color:var(--muted);flex:none}
.prow .ctl{margin-left:auto;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:nowrap;min-width:0}
.prow .val{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.minis{display:flex;background:var(--card2);border-radius:8px;padding:2px}
.minis button{white-space:nowrap;border:0;background:none;border-radius:6px;padding:5px 10px;font-size:14px;color:var(--muted)}
.minis button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
select{max-width:190px}
select,input[type=time],input[type=number],input[type=text]{background:var(--card2);border:0;border-radius:8px;padding:7px 10px;font-size:15px;max-width:100%}
input[type=number]{width:70px;text-align:center}
input[type=time]{min-width:96px}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--card2);transition:.2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--good)}
.sw input:checked+span::after{transform:translateX(20px)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--card);font-weight:600;color:var(--accent);width:100%;font-size:16px}
.btn.small{width:auto;padding:8px 12px;font-size:14px;border-radius:9px;background:var(--card2)}
.btn.danger{color:var(--bad)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;padding:12px 14px;border-radius:12px;background:var(--card)}
.addrow .btn{width:auto}
.copyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:13px;color:var(--muted);margin:8px 4px 0;line-height:1.45}
.warnline{color:var(--warn);font-size:13px;padding:0 16px 10px}

/* history */
.stat{padding:16px;display:flex;gap:14px;align-items:center}
.stat .big{font-size:36px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.bars{padding:6px 16px 12px}
.bar{display:grid;grid-template-columns:96px 1fr 42px;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.bar .track{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:9px}
.bar .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.cal{padding:14px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;border:0;border-radius:9px;background:var(--card2);font-size:13px;color:var(--text);padding:0;position:relative}
.cal button.fut{opacity:.3;pointer-events:none}
.cal button.tod{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted);padding:0 14px 12px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* settings */
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.times div{background:var(--card);padding:10px 12px}
.times b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.times span{font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:8px;border:0;background:var(--card2);font-size:18px;color:var(--accent)}
.step span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* banner/toast */
#banner{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:40;max-width:536px;margin:0 auto;background:var(--card2);
  border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;gap:12px;align-items:center;
  transform:translateY(-140%);transition:transform .3s}
#banner.show{transform:none}
#banner .bt{flex:1;min-width:0}
#banner .bt b{display:block;font-size:17px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--card2);border-radius:12px;padding:10px 14px;font-size:14px;z-index:30;transition:.25s;display:flex;gap:12px;align-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
</style>
</head>
<body>
<main>
  <section id="v-today"></section>
  <section id="v-plan" class="hidden"></section>
  <section id="v-stats" class="hidden"></section>
  <section id="v-settings" class="hidden"></section>
</main>

<nav class="tabs"><div class="in">
  <button data-tab="today" class="on" aria-label="Сегодня">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9"/></svg>Сегодня</button>
  <button data-tab="plan" aria-label="План">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h3M8 17h6"/></svg>План</button>
  <button data-tab="stats" aria-label="История">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>История</button>
  <button data-tab="settings" aria-label="Настройки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
</div></nav>

<div id="banner" role="alert">
  <div style="font-size:26px">🔔</div>
  <div class="bt"><b id="bn-title"></b><span class="sub" id="bn-sub"></span></div>
  <button class="btn small primary" id="bn-done">Отметить</button>
  <button class="iconbtn" id="bn-close" aria-label="Закрыть" style="background:none;color:var(--muted)">✕</button>
</div>
<div id="toast"><span id="toast-t"></span><button id="toast-a" class="hidden"></button></div>

<script>
"use strict";
/* ---------- константы ---------- */
const PRAYERS = ["fajr","dhuhr","asr","maghrib","isha"];
const P_NAME = {fajr:"Фаджр",sunrise:"Восход",dhuhr:"Зухр",asr:"Аср",maghrib:"Магриб",isha:"Иша"};
const P_GEN  = {fajr:"Фаджра",sunrise:"восхода",dhuhr:"Зухра",asr:"Асра",maghrib:"Магриба",isha:"Иши"};
const CITIES = [
  {id:"nazran",name:"Назрань",lat:43.2260,lng:44.7650},
  {id:"magas",name:"Магас",lat:43.1700,lng:44.8100},
  {id:"karabulak",name:"Карабулак",lat:43.3060,lng:44.9020},
  {id:"malgobek",name:"Малгобек",lat:43.5090,lng:44.5890},
  {id:"sunzha",name:"Сунжа",lat:43.3200,lng:45.0500},
  {id:"vladikavkaz",name:"Владикавказ",lat:43.0200,lng:44.6820},
  {id:"grozny",name:"Грозный",lat:43.3180,lng:45.6980},
  {id:"makhachkala",name:"Махачкала",lat:42.9830,lng:47.5040},
  {id:"moscow",name:"Москва",lat:55.7560,lng:37.6170},
  {id:"custom",name:"Свои координаты"}
];
const METHODS = {
  mwl:  {name:"Всемирная исламская лига (18° / 17°)",fajr:18,isha:17},
  dum:  {name:"ДУМ РФ (16° / 15°)",fajr:16,isha:15},
  egypt:{name:"Египет (19,5° / 17,5°)",fajr:19.5,isha:17.5},
  isna: {name:"ISNA (15° / 15°)",fajr:15,isha:15}
};
const WD_SHORT = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const WD_FULL  = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const WD_ORDER = [1,2,3,4,5,6,0];
const DURS = [0,15,30,45,60,90,120,150,180,240,300,360,480,600];
const BEFORES = [0,5,10,15,20,30,60];
const LS_KEY = "moy-den-v1";

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d,12); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const hm = s => { const [h,m] = String(s||"0:0").split(":").map(Number); return (h||0)*60+(m||0); };
const fmt = min => { if (min==null || isNaN(min)) return "—"; const m = ((Math.round(min)%1440)+1440)%1440; return Math.floor(m/60)+":"+pad(m%60); };
const fmtDur = m => { m=+m; if(!m) return "нет"; const h=Math.floor(m/60), r=m%60; return (h?h+" ч":"")+(h&&r?" ":"")+(r?r+" мин":""); };
const nowMin = () => { const n = new Date(); return n.getHours()*60+n.getMinutes()+n.getSeconds()/60; };
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- расчёт времени намазов (алгоритм PrayTimes) ---------- */
const D2R = Math.PI/180;
const dsin=d=>Math.sin(d*D2R), dcos=d=>Math.cos(d*D2R), dtan=d=>Math.tan(d*D2R);
const darcsin=x=>Math.asin(x)/D2R, darccos=x=>Math.acos(x)/D2R, darctan2=(y,x)=>Math.atan2(y,x)/D2R, darccot=x=>Math.atan(1/x)/D2R;
const fixA=(a,b)=>{ a = a - b*Math.floor(a/b); return a<0 ? a+b : a; };
function julian(y,m,d){ if(m<=2){y-=1;m+=12;} const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){
  const D=jd-2451545.0, g=fixA(357.529+0.98560028*D,360), q=fixA(280.459+0.98564736*D,360);
  const L=fixA(q+1.915*dsin(g)+0.020*dsin(2*g),360), e=23.439-0.00000036*D;
  const RA=darctan2(dcos(e)*dsin(L),dcos(L))/15;
  return {decl:darcsin(dsin(e)*dsin(L)), eqt:q/15-fixA(RA,24)};
}
function calcPrayers(date, lat, lng, fajrA, ishaA, asrF){
  const noonLocal = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const tz = -noonLocal.getTimezoneOffset()/60;
  const jd = julian(date.getFullYear(), date.getMonth()+1, date.getDate()) - lng/(15*24);
  const midDay = t => fixA(12 - sunPos(jd+t).eqt, 24);
  const angleTime = (angle,t,ccw) => { const decl=sunPos(jd+t).decl, noon=midDay(t);
    const tt = darccos((-dsin(angle)-dsin(decl)*dsin(lat))/(dcos(decl)*dcos(lat)))/15;
    return noon + (ccw ? -tt : tt); };
  const asrTime = (f,t) => { const decl=sunPos(jd+t).decl; return angleTime(-darccot(f+dtan(Math.abs(lat-decl))), t); };
  const p = {fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18};
  for (const k in p) p[k] /= 24;
  const T = {
    fajr: angleTime(fajrA,p.fajr,true), sunrise: angleTime(0.833,p.sunrise,true),
    dhuhr: midDay(p.dhuhr), asr: asrTime(asrF,p.asr),
    sunset: angleTime(0.833,p.sunset), isha: angleTime(ishaA,p.isha)
  };
  for (const k in T) T[k] += tz - lng/15;
  // высокие широты: метод «угла» (актуально летом для северных городов)
  const diff=(a,b)=>fixA(b-a,24), night=diff(T.sunset,T.sunrise);
  const fp=fajrA/60*night; if (isNaN(T.fajr) || diff(T.fajr,T.sunrise)>fp) T.fajr=T.sunrise-fp;
  const ip=ishaA/60*night; if (isNaN(T.isha) || diff(T.sunset,T.isha)>ip) T.isha=T.sunset+ip;
  T.maghrib = T.sunset;
  const out = {};
  for (const k of ["fajr","sunrise","dhuhr","asr","maghrib","isha"]) out[k] = Math.round(T[k]*60);
  return out;
}

/* ---------- состояние ---------- */
function defaultState(){
  const items = [
    {id:"fajr",name:"Фаджр",prayer:true},{id:"breakfast",name:"Завтрак"},
    {id:"dhuhr",name:"Зухр",prayer:true},{id:"asr",name:"Аср",prayer:true},
    {id:"study",name:"Учёба"},{id:"work",name:"Работа"},
    {id:"maghrib",name:"Магриб",prayer:true},{id:"quran",name:"Коран"},
    {id:"isha",name:"Иша",prayer:true},{id:"sleep",name:"Сон"}
  ];
  const pr = {on:true,mode:"prayer",remind:true,before:0};
  const day = {

function normalize(s){
  const d = defaultState();
  if (!s || typeof s!=="object" || !Array.isArray(s.items)) return d;
  s.settings = Object.assign({}, d.settings, s.settings||{});
  s.settings.adj = Object.assign({}, d.settings.adj, s.settings.adj||{});
  s.plan = s.plan || {}; s.checks = s.checks || {};
  for (let w=0; w<7; w++){ s.plan[w] = s.plan[w] || {};
    for (const it of s.items) if (!s.plan[w][it.id]) s.plan[w][it.id] = it.prayer ? {on:true,mode:"prayer",remind:true,before:0} : {on:false,mode:"fixed",time:"12:00",dur:0,remind:true,before:0}; }
  return s;
}

function save(){

const ptCache = new Map();
function prayerTimes(date){
  const s = state.settings, m = METHODS[s.method] || METHODS.mwl;
  const key = dkey(date)+"|"+s.lat+"|"+s.lng+"|"+s.method+"|"+s.asr+"|"+JSON.stringify(s.adj);
  if (ptCache.has(key)) return ptCache.get(key);
  const t = calcPrayers(date, +s.lat, +s.lng, m.fajr, m.isha, +s.asr===2 ? 2 : 1);
  for (const p of PRAYERS) t[p] += (+s.adj[p]||0);
  ptCache.set(key, t); return t;
}
function computeDay(date){
  const pt = prayerTimes(date), plan = state.plan[date.getDay()], rows = [];
  state.items.forEach((it, idx) => {
    const c = plan[it.id]; if (!c || !c.on) return;
    let start;
    if (it.prayer) start = pt[it.id];
    else if (c.mode==="after") start = pt[c.anchor] + (+c.offset||0);
    else start = hm(c.time);
    const end = (!it.prayer && +c.dur) ? start + (+c.dur) : null;
    rows.push({it, c, start, end, sk: start + (c.mode==="after" ? .01 : 0) + idx*.0001});
  });
  rows.sort((a,b)=>a.sk-b.sk);
  for (const r of rows) if (r.end!=null)
    r.inside = PRAYERS.filter(p => plan[p] && plan[p].on && pt[p] >= r.start && pt[p] < r.end);
  return {pt, rows};
}
const checked = (key,id) => (state.checks[key]||[]).includes(id);
function toggle(key,id){
  const a = state.checks[key] = state.checks[key] || [];
  const i = a.indexOf(id); if (i>=0) a.splice(i,1); else a.push(id);
  if (!a.length) delete state.checks[key];
  save();
}

/* ---------- ИСТОРИЯ ---------- */
function plannedIds(date){ const p = state.plan[date.getDay()]; return state.items.filter(it => p[it.id] && p[it.id].on).map(it=>it.id); }
function ratio(date){ const ids = plannedIds(date); if (!ids.length) return null; const k = dkey(date); return ids.filter(id=>checked(k,id)).length/ids.length; }
function prayersComplete(date){ const p = state.plan[date.getDay()], k = dkey(date);
  const ids = PRAYERS.filter(x=>p[x]&&p[x].on); return ids.length>0 && ids.every(id=>checked(k,id)); }
function renderStats(){
  const today = new Date();
  let streak = 0, d = prayersComplete(today) ? today : addDays(today,-1);
  for (let i=0; i<3650 && prayersComplete(d); i++){ streak++; d = addDays(d,-1); }
  let best = 0, run = 0; const keys = Object.keys(state.checks).sort();
  if (keys.length){ let x = fromKey(keys[0]); while (dkey(x) <= dkey(today)){ if (prayersComplete(x)){ run++; best = Math.max(best,run);} else run = 0; x = addDays(x,1); } }
  // 7 дней по пунктам
  const bars = state.items.map(it => { let pl=0, dn=0;
    for (let i=0;i<7;i++){ const dt = addDays(today,-i), c = state.plan[dt.getDay()][it.id]; if (c && c.on){ pl++; if (checked(dkey(dt),it.id)) dn++; } }
    return {it, pl, dn}; }).filter(x=>x.pl);
  // календарь 5 недель
  const offs = (today.getDay()+6)%7; let start = addDays(today, -offs-28);
  let cells = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(h=>`<div class="h">${h}</div>`).join("");
  for (let i=0;i<35;i++){ const dt = addDays(start,i), k = dkey(dt), fut = k > dkey(today), r = fut ? null : ratio(dt);
    const bg = r==null || r===0 ? "" : `background:color-mix(in srgb,var(--accent) ${Math.round(20+r*80)}%,var(--card2));${r>=.6?"color:var(--accent-ink);font-weight:600":""}`;
    cells += `<button data-k="${k}" class="${fut?"fut":""} ${k===dkey(today)?"tod":""}" style="${bg}">${dt.getDate()}</button>`; }
  $("#v-stats").innerHTML = `
    <h1>История</h1><div class="sub">Как получается держать распорядок</div>
    <div class="card stat" style="margin-top:14px"><div class="big">${streak}</div>
      <div><b>${plural(streak,"день","дня","дней")} подряд</b><div class="sub">все намазы отмечены${best>streak?` · рекорд ${best}`:""}</div></div></div>
    <h2>Последние 7 дней</h2>
    <div class="card bars">${bars.map(b=>{const p=Math.round(b.dn/b.pl*100);return `<div class="bar"><span>${esc(b.it.name)}</span><div class="track"><div class="fill" style="width:${p}%"></div></div><span class="pct">${b.dn}/${b.pl}</span></div>`;}).join("") || '<div class="empty">Пока нет данных</div>'}</div>
    <h2>5 недель</h2>
    <div class="card"><div class="cal" id="cal">${cells}</div>
      <div class="legend">меньше <i style="background:var(--card2)"></i><i style="background:color-mix(in srgb,var(--accent) 45%,var(--card2))"></i><i style="background:var(--accent)"></i> больше</div></div>
    <p class="note">Нажми на день, чтобы открыть его и дополнить отметки.</p>`;
}
function plural(n,a,b,c){ const m10=n%10, m100=n%100; return m10===1&&m100!==11?a : m10>=2&&m10<=4&&(m100<10||m100>=20)?b : c; }

    <h2>Расчёт</h2>
    <div class="card">
      <div class="prow" style="border:0"><label>Город</label><div class="ctl"><select data-s="city">${CITIES.map(c=>`<option value="${c.id}"${c.id===s.city?" selected":""}>${c.name}</option>`).join("")}</select></div></div>
      ${s.city==="custom"?`<div class="prow"><label>Широта</label><div class="ctl"><input type="number" step="0.001" data-s="lat" value="${s.lat}" style="width:110px"></div></div>
      <div class="prow"><label>Долгота</label><div class="ctl"><input type="number" step="0.001" data-s="lng" value="${s.lng}" style="width:110px"></div></div>`:""}
      <div class="prow"><label>Метод</label><div class="ctl"><select data-s="method">${Object.entries(METHODS).map(([k,m])=>`<option value="${k}"${k===s.method?" selected":""}>${m.name}</option>`).join("")}</select></div></div>
      <div class="prow"><label>Аср</label><div class="ctl"><div class="minis">
        <button data-act="asr" data-v="1" class="${+s.asr!==2?"on":""}">Шафии</button><button data-act="asr" data-v="2" class="${+s.asr===2?"on":""}">Ханафи</button></div></div></div>
    </div>
    <h2>Поправки, мин</h2>
    <div class="card">${PRAYERS.map((p,i)=>`<div class="prow"${i?"":' style="border:0"'}><label>${P_NAME[p]}</label><div class="ctl step">
      <button data-act="adj" data-p="${p}" data-v="-1" aria-label="минус минута">−</button><span>${(s.adj[p]>0?"+":"")+s.adj[p]}</span><button data-act="adj" data-p="${p}" data-v="1" aria-label="плюс минута">+</button></div></div>`).join("")}</div>
    <p class="note">Сверь время с расписанием своей мечети или муфтията и подгони поправками, если есть разница в пару минут.</p>
    <h2>Напоминания</h2>
    <div class="card"><div class="prow" style="border:0"><label>Звук</label><div class="ctl"><label class="sw"><input type="checkbox" data-s="sound"${s.sound?" checked":""}><span></span></label></div></div></div>
    <p class="note">Пока приложение открыто, в нужное время сверху появится напоминание со звуком (звук включится после первого нажатия на экран). При закрытом приложении уведомления не приходят — для этого можно поставить напоминания в календарь iPhone.</p>
    <h2>Резервная копия</h2>
    <div class="card"><div class="prow" style="border:0"><label>Хранение</label><span class="val sub">только на этом телефоне</span></div></div>
    <div class="copyrow"><button class="btn small" data-act="backup">Скопировать копию</button><button class="btn small" data-act="restore-open">Восстановить</button></div>
    <div id="restorebox" class="hidden" style="margin-top:8px"><textarea id="restoretxt" rows="4" placeholder="Вставь сюда скопированную копию" style="width:100%;background:var(--card);border:0;border-radius:12px;padding:12px;color:var(--text);font:14px/1.4 ui-monospace,Menlo,monospace"></textarea>
      <button class="btn primary" data-act="restore" style="margin-top:8px">Восстановить из копии</button></div>
    <p class="note">Иногда сохраняй копию, например в Заметки: если удалить иконку с экрана, отметки удалятся вместе с ней.</p>
    <div style="margin-top:14px"><button class="btn danger" data-act="reset">${resetArm?"Нажми ещё раз — сбросить всё":"Сбросить план и отметки"}</button></div>
    <p class="note">Время намазов считается по астрономическому алгоритму с учётом выбранного метода.</p>`;
}
const vSet = $("#v-settings");
vSet.addEventListener("change", e => {
  const el = e.target, k = el.dataset.s; if (!k) return; const s = state.settings;
  if (k==="city"){ s.city = el.value; const c = CITIES.find(x=>x.id===el.value); if (c && c.lat!=null){ s.lat=c.lat; s.lng=c.lng; } }
  else if (k==="lat"||k==="lng"){ const v = parseFloat(el.value); if (!isNaN(v) && Math.abs(v)<=(k==="lat"?66:180)) s[k]=v; }
  else if (k==="sound") s.sound = el.checked;
  else s[k] = el.value;
  save(); renderSettings();
});
vSet.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return; const s = state.settings;
  if (b.dataset.act==="asr"){ s.asr = +b.dataset.v; }
  else if (b.dataset.act==="adj"){ const p=b.dataset.p; s.adj[p] = Math.max(-30, Math.min(30, (+s.adj[p]||0) + (+b.dataset.v))); }
  else if (b.dataset.act==="backup"){
    const txt = "MOYDEN1:" + btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("Копия скопирована — вставь её в Заметки"), ()=>{
      $("#restorebox").classList.remove("hidden"); const t=$("#restoretxt"); t.value=txt; t.select(); toast("Выдели текст и скопируй вручную"); });
    return;
  }
  else if (b.dataset.act==="restore-open"){ $("#restorebox").classList.toggle("hidden"); $("#restoretxt").value=""; return; }
  else if (b.dataset.act==="restore"){
    try { let t = $("#restoretxt").value.trim(); if (t.startsWith("MOYDEN1:")) t = decodeURIComponent(escape(atob(t.slice(8))));
      const s = normalize(JSON.parse(t)); if (!s.items || !s.items.length) throw 0;
      const backup = clone(state); state = s; save(); renderSettings();
      toast("Данные восстановлены", "Отменить", () => { state = backup; save(); render(); });
    } catch(e){ toast("Не похоже на копию — проверь, что вставлен весь текст"); }
    return;
  }
  else if (b.dataset.act==="reset"){
    if (!resetArm){ resetArm = true; setTimeout(()=>{ resetArm=false; if(curTab==="settings") renderSettings(); }, 3500); renderSettings(); return; }
    resetArm = false; const backup = clone(state); state = defaultState(); save(); renderSettings();
    toast("Всё сброшено", "Вернуть", () => { state = backup; save(); render(); });
    return;
  }
  save(); renderSettings();
});

/* ---------- тост ---------- */
let toastTimer = null;
function toast(text, actLabel, act){
  $("#toast-t").textContent = text;
  const a = $("#toast-a");
  if (actLabel){ a.textContent = actLabel; a.classList.remove("hidden"); a.onclick = () => { act(); hideToast(); }; }
  else a.classList.add("hidden");
  $("#toast").classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
}
function hideToast(){ $("#toast").classList.remove("show"); }

/* ---------- напоминания внутри приложения ---------- */
let actx = null;
document.addEventListener("pointerdown", () => {
  try { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==="suspended") actx.resume(); } catch(e){}
}, {passive:true});
function beep(){
  if (!actx || !state.settings.sound) return;
  try { const t0 = actx.currentTime;
    [[0,784],[.28,988],[.56,1175]].forEach(([dt,f]) => { const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t0+dt);
      g.gain.exponentialRampToValueAtTime(.3,t0+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.25);
      o.connect(g); g.connect(actx.destination); o.start(t0+dt); o.stop(t0+dt+.3); });
  } catch(e){}
}
const fired = new Set(); let bannerItem = null, bannerTimer = null;
function checkReminders(){
  const today = new Date(), key = dkey(today), now = nowMin();
  const {rows} = computeDay(today);
  for (const r of rows){
    if (!r.c.remind) continue;
    const at = r.start - (+r.c.before||0), fk = key+"|"+r.it.id;
    if (fired.has(fk)) continue;
    if (now >= at && now < at+3){
      fired.add(fk);
      if (checked(key, r.it.id)) continue;
      showBanner(r, key); beep(); break;
    } else if (now >= at+3) fired.add(fk);
  }
}
function showBanner(r, key){
  bannerItem = {id:r.it.id, key};
  $("#bn-title").textContent = r.it.name + (r.it.prayer ? " — время намаза" : "");
  $("#bn-sub").textContent = (r.c.before ? "через "+fmtDur(r.c.before)+", " : "") + "в " + fmt(r.start) + (r.end!=null ? "–"+fmt(r.end) : "");
  $("#banner").classList.add("show"); clearTimeout(bannerTimer); bannerTimer = setTimeout(hideBanner, 120000);
}
function hideBanner(){ $("#banner").classList.remove("show"); bannerItem = null; }
$("#bn-close").onclick = hideBanner;
$("#bn-done").onclick = () => { if (bannerItem && !checked(bannerItem.key, bannerItem.id)) toggle(bannerItem.key, bannerItem.id); hideBanner(); render(); };

/* ---------- офлайн ---------- */
if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- старт ---------- */
render();
// уже прошедшие напоминания сегодня не показываем задним числом
(function primeFired(){ const k = dkey(new Date()), now = nowMin();
  for (const r of computeDay(new Date()).rows){ const at = r.start - (+r.c.before||0); if (now >= at+0.5) fired.add(k+"|"+r.it.id); } })();
let lastKey = dkey(new Date());
setInterval(() => {
  checkReminders();
  const k = dkey(new Date());
  if (k !== lastKey){ if (curTab==="today" && dkey(viewDate)===lastKey) viewDate = new Date(); lastKey = k; }
  const ae = document.activeElement;
  if (curTab==="today" && !(ae && /INPUT|SELECT/.test(ae.tagName))) renderToday();
}, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ checkReminders(); if (curTab==="today") renderToday(); } });
</script>
</body>
</html>
